<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">DevOpsAI incident investigation architecture</title>
  <desc id="desc">Operator input passes through validation and secret redaction, then a sequential five-agent CrewAI investigation using the OpenAI API. A schema-validated incident report is saved in SQLite, reviewed by a human, and never automatically executed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081323"/><stop offset="1" stop-color="#111f35"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#51d6bd"/><stop offset="1" stop-color="#69a8ff"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020914" flood-opacity=".3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#a9c5e2"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#59d7c0"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#edf5ff}
      .muted{fill:#aec0d5}.tiny{font-size:13px}.small{font-size:15px}.body{font-size:16px}.label{font-size:12px;font-weight:750;letter-spacing:1.25px;fill:#8eafd0}.stage{fill:#12243a;stroke:#2a4562;stroke-width:1.4}.agent{fill:#11243a;stroke:#304c69;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1460" cy="70" r="190" fill="#23436a" opacity=".12"/><circle cx="65" cy="950" r="240" fill="#1a816f" opacity=".07"/>
  <text x="64" y="54" class="label">SYSTEM ARCHITECTURE</text>
  <text x="64" y="101" font-size="38" font-weight="730">DevOpsAI Incident Investigation</text>
  <text x="66" y="132" font-size="17" class="muted">Evidence-led analysis, structured recommendations, and human approval before action.</text>

  <!-- Primary workflow -->
  <g filter="url(#shadow)">
    <rect x="64" y="165" width="205" height="166" rx="16" class="stage"/>
    <rect x="300" y="165" width="242" height="166" rx="16" class="stage"/>
    <rect x="573" y="165" width="366" height="166" rx="16" fill="#142b40" stroke="#3a6c79" stroke-width="1.6"/>
    <rect x="970" y="165" width="245" height="166" rx="16" class="stage"/>
    <rect x="1246" y="165" width="290" height="166" rx="16" class="stage"/>
    <rect x="970" y="357" width="245" height="64" rx="12" fill="#102a3d" stroke="#3c6474" stroke-width="1.2"/>
  </g>
  <path d="M269 248h26M542 248h26M939 248h26M1215 248h26" fill="none" stroke="#a9c5e2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="87" y="198" class="label">01 · INTAKE</text><text x="87" y="231" font-size="20" font-weight="680">Operator</text>
  <text x="87" y="262" class="small muted">Incident description</text><text x="87" y="286" class="small muted">Environment + log sample</text><text x="87" y="313" class="tiny muted">Web UI or command line</text>
  <text x="323" y="198" class="label">02 · INPUT SAFETY</text><text x="323" y="231" font-size="20" font-weight="680">Guardrails</text>
  <text x="323" y="262" class="small muted">Required fields + size limits</text><text x="323" y="286" class="small muted">Redact common secret patterns</text><text x="323" y="313" class="tiny muted">Sanitized input reaches agents</text>
  <text x="596" y="198" class="label">03 · INVESTIGATION</text><text x="596" y="231" font-size="20" font-weight="680">CrewAI · five sequential agents</text>
  <text x="596" y="262" class="small muted">Each agent contributes findings to the next task.</text>
  <rect x="596" y="285" width="320" height="28" rx="8" fill="#1c3b50" stroke="#396276"/><text x="609" y="305" class="tiny" fill="#92e6d2">OpenAI API · gpt-4o-mini, gpt-4o fallback</text>
  <text x="993" y="198" class="label">04 · STRUCTURED RESULT</text><text x="993" y="231" font-size="20" font-weight="680">Incident report</text>
  <text x="993" y="262" class="small muted">Validated against report schema</text><text x="993" y="286" class="small muted">Severity · causes · evidence</text><text x="993" y="313" class="tiny muted">Recommended actions + confidence</text>
  <text x="1269" y="198" class="label">05 · HUMAN REVIEW</text><text x="1269" y="231" font-size="20" font-weight="680">Operator decision</text>
  <text x="1269" y="262" class="small muted">Approve or reject the report</text><text x="1269" y="286" class="small muted">Approval required before action</text><text x="1269" y="313" class="tiny muted">System never executes changes</text>
  <!-- Explicit persistence and approval paths -->
  <path d="M1092 331v21" fill="none" stroke="#59d7c0" stroke-width="2.8" marker-end="url(#arrowTeal)"/>
  <path d="M1390 331v45h-167" fill="none" stroke="#a9c5e2" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="1250" y="350" class="tiny muted">approval status</text>
  <text x="990" y="383" class="label">SQLITE HISTORY</text><text x="990" y="406" class="tiny muted">Report + approval status</text>

  <!-- Agent sequence -->
  <text x="64" y="454" class="label">AGENT ROLES, DESCRIPTIONS &amp; WHY THEY MATTER</text>
  <text x="1536" y="454" text-anchor="end" class="tiny muted">Runs in order · outputs inform downstream tasks</text>
  <g filter="url(#shadow)">
    <rect x="64" y="477" width="278" height="378" rx="16" class="agent"/><rect x="360" y="477" width="278" height="378" rx="16" class="agent"/>
    <rect x="656" y="477" width="278" height="378" rx="16" class="agent"/><rect x="952" y="477" width="278" height="378" rx="16" class="agent"/>
    <rect x="1248" y="477" width="288" height="378" rx="16" class="agent"/>
  </g>
  <g fill="url(#accent)"><rect x="64" y="477" width="278" height="5" rx="3"/><rect x="360" y="477" width="278" height="5" rx="3"/><rect x="656" y="477" width="278" height="5" rx="3"/><rect x="952" y="477" width="278" height="5" rx="3"/><rect x="1248" y="477" width="288" height="5" rx="3"/></g>
  <path d="M344 499h13M640 499h13M936 499h13M1232 499h13" stroke="#59d7c0" stroke-width="3" marker-end="url(#arrowTeal)"/>

  <!-- Agent 1 -->
  <text x="84" y="514" class="label">AGENT 1 · TRIAGE</text><text x="84" y="545" font-size="18" font-weight="700">Incident triage</text>
  <text x="84" y="580" class="label">ROLE</text><text x="84" y="604" class="body">DevOps incident specialist</text>
  <text x="84" y="640" class="label">DESCRIPTION</text><text x="84" y="665" class="body muted"><tspan x="84">Assesses impact, scope and</tspan><tspan x="84" dy="22">severity; identifies missing</tspan><tspan x="84" dy="22">information and separates</tspan><tspan x="84" dy="22">facts from assumptions.</tspan></text>
  <text x="84" y="772" class="label">WHY IT MATTERS</text><text x="84" y="797" class="body"><tspan x="84">Sets investigation scope and</tspan><tspan x="84" dy="22">helps responders prioritize</tspan><tspan x="84" dy="22">their effort.</tspan></text>
  <!-- Agent 2 -->
  <text x="380" y="514" class="label">AGENT 2 · LOGS</text><text x="380" y="545" font-size="18" font-weight="700">Log analysis</text>
  <text x="380" y="580" class="label">ROLE</text><text x="380" y="604" class="body">Application / infrastructure</text><text x="380" y="626" class="body">log analyst</text>
  <text x="380" y="662" class="label">DESCRIPTION</text><text x="380" y="687" class="body muted"><tspan x="380">Finds errors, timestamps and</tspan><tspan x="380" dy="22">patterns in supplied logs;</tspan><tspan x="380" dy="22">records observations and</tspan><tspan x="380" dy="22">evidence without inference.</tspan></text>
  <text x="380" y="794" class="label">WHY IT MATTERS</text><text x="380" y="819" class="body"><tspan x="380">Turns raw logs into evidence</tspan><tspan x="380" dy="22">that can test each hypothesis.</tspan></text>
  <!-- Agent 3 -->
  <text x="676" y="514" class="label">AGENT 3 · RESEARCH</text><text x="676" y="545" font-size="18" font-weight="700">Technical research</text>
  <text x="676" y="580" class="label">ROLE</text><text x="676" y="604" class="body">DevOps research specialist</text>
  <text x="676" y="640" class="label">DESCRIPTION</text><text x="676" y="665" class="body muted"><tspan x="676">Checks approved runbooks and</tspan><tspan x="676" dy="22">past incidents when verified</tspan><tspan x="676" dy="22">reference material is available;</tspan><tspan x="676" dy="22">states when it is unavailable.</tspan></text>
  <text x="676" y="772" class="label">WHY IT MATTERS</text><text x="676" y="797" class="body"><tspan x="676">Adds traceable guidance and</tspan><tspan x="676" dy="22">avoids inventing procedures.</tspan></text>
  <!-- Agent 4 -->
  <text x="972" y="514" class="label">AGENT 4 · ROOT CAUSE</text><text x="972" y="545" font-size="18" font-weight="700">Root cause analysis</text>
  <text x="972" y="580" class="label">ROLE</text><text x="972" y="604" class="body">Senior site reliability and</text><text x="972" y="626" class="body">root cause analyst</text>
  <text x="972" y="662" class="label">DESCRIPTION</text><text x="972" y="687" class="body muted"><tspan x="972">Ranks plausible causes using</tspan><tspan x="972" dy="22">supporting, conflicting and</tspan><tspan x="972" dy="22">missing evidence; identifies</tspan><tspan x="972" dy="22">lists checks to test them.</tspan></text>
  <text x="972" y="794" class="label">WHY IT MATTERS</text><text x="972" y="819" class="body"><tspan x="972">Keeps hypotheses distinct from</tspan><tspan x="972" dy="22">confirmed causes.</tspan></text>
  <!-- Agent 5 -->
  <text x="1268" y="514" class="label">AGENT 5 · REPORT</text><text x="1268" y="545" font-size="18" font-weight="700">Remediation &amp; risk</text>
  <text x="1268" y="580" class="label">ROLE</text><text x="1268" y="604" class="body">DevOps remediation and</text><text x="1268" y="626" class="body">risk specialist</text>
  <text x="1268" y="662" class="label">DESCRIPTION</text><text x="1268" y="687" class="body muted"><tspan x="1268">Builds the schema-validated</tspan><tspan x="1268" dy="22">report with ranked causes,</tspan><tspan x="1268" dy="22">prioritized actions, risks and</tspan><tspan x="1268" dy="22">verification steps.</tspan></text>
  <text x="1268" y="794" class="label">WHY IT MATTERS</text><text x="1268" y="819" class="body"><tspan x="1268">Makes safe next steps clear;</tspan><tspan x="1268" dy="22">a human decides and acts.</tspan></text>

  <rect x="64" y="881" width="1472" height="76" rx="14" fill="#10263a" stroke="#294861" stroke-width="1.2"/>
  <circle cx="97" cy="919" r="12" fill="#214d49"/><path d="M97 910v10M97 925v1" stroke="#7ae0be" stroke-width="2.4" stroke-linecap="round"/>
  <text x="124" y="914" class="label">HUMAN-DIRECTED RECOMMENDATIONS</text><text x="124" y="939" class="small">Reports are saved for review. Operators approve or reject recommendations; DevOpsAI does not change production systems.</text>
  <text x="1536" y="982" text-anchor="end" class="tiny muted">Python · Gradio · CrewAI · OpenAI · SQLite</text>
</svg>
