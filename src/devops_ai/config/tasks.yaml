incident_triage_task:
  description: >
    Review the incident details provided below.

    Incident description:
    {description}

    Environment:
    {environment}

    Log sample:
    {log_sample}

    Assess the potential impact and scope of the incident. Identify affected
    services if the evidence supports it, estimate severity, and list missing
    information. Separate confirmed facts from assumptions. Do not invent
    metrics, affected users, or business impact.
  expected_output: >
    A structured incident triage assessment containing the incident summary,
    potential impact, affected services, proposed severity with justification,
    confirmed facts, assumptions, and missing information.
  agent: incident_triage_agent

log_analysis_task:
  description: >
    Analyze the incident description, environment, and supplied log sample.

    Incident description:
    {description}

    Environment:
    {environment}

    Log sample:
    {log_sample}

    Identify error messages, timestamps, recurring patterns, possible
    failure sequences, and relevant evidence. Quote only log content that
    was actually provided. Do not claim that a pattern proves the root cause.
    Identify important information that is missing from the logs.
  expected_output: >
    A log analysis containing key observations, relevant log excerpts,
    timestamps when available, possible patterns, supporting evidence,
    and limitations of the available data.
  agent: log_analysis_agent

technical_research_task:
  description: >
    Use only available approved documentation, runbooks, or historical
    incident references to find troubleshooting guidance relevant to this
    incident.

    Incident description:
    {description}

    Environment:
    {environment}

    Log sample:
    {log_sample}

    If no approved reference material or research tools are available,
    state that clearly. Do not invent documentation, source links,
    historical incidents, or procedures.
  expected_output: >
    Relevant troubleshooting guidance with its source, applicability
    to this incident, and any limitations. If no approved reference
    material is available, explicitly state that no verified references
    were available.
  agent: technical_research_agent

root_cause_task:
  description: >
    Develop and rank plausible root-cause hypotheses using the incident
    details, the triage assessment, log analysis, and available technical
    research from previous tasks.

    Incident description:
    {description}

    Environment:
    {environment}

    Distinguish evidence that supports each hypothesis from evidence that
    contradicts it. Explain what additional information would help confirm
    or reject each hypothesis. Do not present a hypothesis as a confirmed
    root cause unless the evidence justifies that conclusion.
  expected_output: >
    A ranked list of plausible root-cause hypotheses, each containing
    supporting evidence, contradictory evidence, confidence or uncertainty,
    and suggested checks to confirm or reject the hypothesis.
  agent: root_cause_agent

remediation_risk_task:
  description: >
    Produce the final structured incident investigation report using the
    incident details and the outputs of all previous investigation tasks.

    Incident ID: {incident_id}
    Environment: {environment}
    Incident description: {description}

    Original log sample:
    {log_sample}

    Use the preceding task outputs to synthesize the findings from incident
    triage, log analysis, technical research, root-cause analysis, and
    remediation risk assessment.

    Requirements:
    - Set incident_id to the supplied incident ID.
    - Write a concise summary of the incident and findings.
    - Select severity as exactly one of: critical, high, medium, low, unknown.
    - Include likely causes supported by the available evidence.
    - Separate observed facts from inferences in the evidence list.
    - For every evidence item, provide an observation, source, and evidence_type.
    - List practical recommended actions in priority order.
    - Set confidence to a number between 0.0 and 1.0.
    - Set requires_human_approval to true.
    - Do not invent metrics, logs, research references, or confirmed root causes.
    - Clearly indicate uncertainty when the evidence is insufficient.
    - Do not execute or claim to have executed remediation actions.
    - Follow the IncidentReport schema exactly.

    Return the final report as a structured IncidentReport object.
  expected_output: >
    A validated IncidentReport containing the incident ID, summary, severity,
    likely causes, evidence, recommended actions, confidence, and human
    approval requirement.
  agent: remediation_risk_agent